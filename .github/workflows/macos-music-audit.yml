name: Audit macOS music-only port

on:
  push:
    branches:
      - macos-music-audit
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Audit Git dependency accessibility
        shell: bash
        run: |
          python3 - <<'PY' > /tmp/giturls.txt
          from pathlib import Path
          for line in Path('pubspec.yaml').read_text().splitlines():
              s = line.strip()
              if s.startswith('url: https://github.com/'):
                  print(s.split('url:',1)[1].strip())
          PY

          echo '=== Git URLs ==='
          cat /tmp/giturls.txt
          echo
          echo '=== inaccessible Git dependencies ==='
          while IFS= read -r url; do
            if ! timeout 12s git ls-remote "$url" HEAD >/dev/null 2>&1; then
              echo "$url"
            fi
          done < /tmp/giturls.txt
