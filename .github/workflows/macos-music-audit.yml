name: Audit macOS music-only port

on:
  push:
    branches:
      - macos-music-audit
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Audit playlist manager API surface
        shell: bash
        run: |
          echo '=== PlaylistController.inst member uses outside controller ==='
          grep -RhoE 'PlaylistController\.inst\.[A-Za-z0-9_]+' lib --include='*.dart' | sort -u || true
          echo
          echo '=== PlaylistController inherited bare member calls inside controller ==='
          grep -oE '\b(playlistsMap|favouritePlaylist|favouritePlaylistRx|getPlaylist|removePlaylists|removePlaylist|updatePropertyInPlaylist|replaceTheseTracksInPlaylists|replaceTheseTracksInPlaylistsBulk|toggleTrackFavourite|prepareAllPlaylistsFile|prepareDefaultPlaylistsFileAsync|addTracksToPlaylistRaw|addNewPlaylistRaw|setArtworkForPlaylist|getArtworkFileForPlaylist|renamePlaylist)\b' lib/controller/playlist_controller.dart | sort -u || true
          echo
          echo '=== playlist object fields commonly used ==='
          grep -RhoE '\bplaylist\.(name|tracks|modifiedDate|creationDate|comment|moods|m3uPath|sorts|reverse|isFavourite|playlistID|id|artwork)[A-Za-z0-9_]*' lib --include='*.dart' | sort -u || true
          echo
          echo '=== PlaylistAddDuplicateAction cases ==='
          grep -RhoE 'PlaylistAddDuplicateAction\.[A-Za-z0-9_]+' lib --include='*.dart' | sort -u || true
          echo
          echo '=== FavouritePlaylist references ==='
          grep -RHnE 'FavouritePlaylist|favouritePlaylist' lib --include='*.dart' | head -n 250 || true
