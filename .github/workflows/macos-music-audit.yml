name: Audit macOS music-only port

on:
  push:
    branches:
      - macos-music-audit
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Audit private audio handler coupling
        shell: bash
        run: |
          echo '=== files importing basic_audio_handler ==='
          grep -RIl "package:basic_audio_handler" lib --include='*.dart' || true
          echo
          echo '=== import lines ==='
          grep -RH "package:basic_audio_handler" lib --include='*.dart' || true
          echo
          echo '=== likely basic_audio_handler identifiers used by Namida ==='
          find lib -name '*.dart' -print0 | xargs -0 grep -hoE '\b(BasicAudioHandler|PlayerConfig|PlayerRepeatMode|InterruptionType|InterruptionAction|SleepTimerConfig|AudioTrack|VideoInfoData|AndroidEqualizerExtended|AndroidLoudnessEnhancerExtended|AudioPipeline|AudioVideoSource|AVPlayer|QueueManager|QueueSourceBase)[A-Za-z0-9_]*\b' | sort -u || true
          echo
          echo '=== handler member calls from player_controller ==='
          grep -oE '_audioHandler\.[A-Za-z0-9_]+' lib/controller/player_controller.dart | sort -u || true
