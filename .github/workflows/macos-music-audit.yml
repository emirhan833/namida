name: Audit macOS music-only port

on:
  push:
    branches:
      - macos-music-audit
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Audit shared YouTube coupling
        shell: bash
        run: |
          echo '=== settings.youtube members used outside lib/youtube ==='
          find lib -name '*.dart' -not -path 'lib/youtube/*' -print0 \
            | xargs -0 grep -hoE 'settings\.youtube\.[A-Za-z0-9_]+' \
            | sort -u || true
          echo
          echo '=== package:youtipie imports outside lib/youtube ==='
          grep -RIl "package:youtipie" lib --include='*.dart' | grep -v '^lib/youtube/' || true
          echo
          echo '=== imports of lib/youtube from outside lib/youtube ==='
          grep -RIl "package:namida/youtube/" lib --include='*.dart' | grep -v '^lib/youtube/' || true
          echo
          echo '=== YouTube-ish identifiers used outside lib/youtube ==='
          find lib -name '*.dart' -not -path 'lib/youtube/*' -print0 \
            | xargs -0 grep -hoE '\b(Youtube|YouTube|YT|YTHosted|VideoLike|Membership|Youti|ExecuteDetails|AudioStream|VideoStream)[A-Za-z0-9_]*\b' \
            | sort -u || true
