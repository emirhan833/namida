name: Audit macOS music-only port

on:
  push:
    branches:
      - macos-music-audit
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: List non-YouTube files coupled to YouTube/private packages
        shell: bash
        run: |
          echo '=== package:youtipie imports outside lib/youtube ==='
          grep -RIl "package:youtipie" lib --include='*.dart' | grep -v '^lib/youtube/' || true
          echo
          echo '=== namico imports outside lib/youtube ==='
          grep -RIlE "package:namico_(login|subscription)_manager" lib --include='*.dart' | grep -v '^lib/youtube/' || true
          echo
          echo '=== imports of lib/youtube from outside lib/youtube ==='
          grep -RIl "package:namida/youtube/" lib --include='*.dart' | grep -v '^lib/youtube/' || true
          echo
          echo '=== all NamidaPlatformBuilder.init call sites ==='
          grep -RIl "NamidaPlatformBuilder.init" lib/controller lib/core --include='*.dart' || true
          echo
          echo '=== pubspec private namidaco deps ==='
          grep -n -A3 -B1 "github.com/namidaco/" pubspec.yaml || true
