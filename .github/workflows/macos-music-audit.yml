name: Audit macOS music-only port

on:
  push:
    branches:
      - macos-music-audit
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Audit private local-library packages
        shell: bash
        run: |
          for pkg in playlist_manager history_manager namico_db_wrapper; do
            echo "=== files importing $pkg ==="
            grep -RIl "package:$pkg" lib --include='*.dart' || true
            echo
            echo "=== import/export lines for $pkg ==="
            grep -RH "package:$pkg" lib --include='*.dart' || true
            echo
          done

          echo '=== playlist_manager identifiers ==='
          find lib -name '*.dart' -print0 | xargs -0 grep -hoE '\b(PlaylistManager|PlaylistItemWithDate|PlaylistID|Playlist|PlaylistSearch|PlaylistCategory|SortTypePlaylist)[A-Za-z0-9_]*\b' | sort -u || true
          echo
          echo '=== history_manager identifiers ==='
          find lib -name '*.dart' -print0 | xargs -0 grep -hoE '\b(HistoryManager|HistoryRecord|HistoryEntry|ItemWithDate|TrackSource)[A-Za-z0-9_]*\b' | sort -u || true
          echo
          echo '=== namico_db_wrapper identifiers ==='
          find lib -name '*.dart' -print0 | xargs -0 grep -hoE '\b(NamicoDB|DBWrapper|DatabaseWrapper|DBConfig|DBManager|NamicoDb)[A-Za-z0-9_]*\b' | sort -u || true
          echo
          echo '=== PlaylistController inheritance and key manager members ==='
          grep -nE 'class PlaylistController|PlaylistManager<|super\.|playlist[A-Za-zA-Z0-9_]*\.' lib/controller/playlist_controller.dart | head -n 250 || true
          echo
          echo '=== HistoryController inheritance and key manager members ==='
          grep -nE 'class HistoryController|HistoryManager<|super\.|history[A-Za-zA-Z0-9_]*\.' lib/controller/history_controller.dart | head -n 250 || true
