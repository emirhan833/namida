name: Build Namida for macOS

on:
  push:
    branches:
      - macos-port
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Add macOS runner
        run: flutter create --platforms=macos --no-pub .

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build macOS release
        run: flutter build macos --release

      - name: Package app
        if: success()
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent namida.app Namida-macOS.zip

      - name: Upload macOS build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Namida-macOS
          path: build/macos/Build/Products/Release/Namida-macOS.zip
          if-no-files-found: error
