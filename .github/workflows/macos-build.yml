name: Build Namida for macOS

on:
  push:
    branches:
      - macos-port
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Add macOS runner
        run: flutter create --platforms=macos --no-pub .

      - name: Pin file_picker revision
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pubspec.yaml')
          s = p.read_text()
          old = "  file_picker:\n    git:\n      url: https://github.com/miguelpruivo/flutter_file_picker\n"
          new = "  file_picker:\n    git:\n      url: https://github.com/miguelpruivo/flutter_file_picker\n      ref: 8dc97859f42ca7ca2d6d347dd7960a3c7b657baf\n"
          if old not in s:
              raise SystemExit('file_picker block not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build macOS release
        run: flutter build macos --release

      - name: Package app
        if: success()
        run: |
          cd build/macos/Build/Products/Release
          APP=$(find . -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" Namida-macOS.zip

      - name: Upload macOS build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Namida-macOS
          path: build/macos/Build/Products/Release/Namida-macOS.zip
          if-no-files-found: error
