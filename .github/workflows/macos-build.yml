name: Build Namida Music for macOS

on:
  push:
    branches:
      - macos-music-port
  workflow_dispatch:

jobs:
  build-macos-music:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout Namida
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Add native macOS runner
        run: flutter create --platforms=macos --no-pub .

      - name: Prepare real Namida music-only source
        run: python3 tool/prepare_macos_music_port.py

      - name: Configure macOS permissions and app name
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          for filename in [
              'macos/Runner/Release.entitlements',
              'macos/Runner/DebugProfile.entitlements',
          ]:
              p = Path(filename)
              data = plistlib.loads(p.read_bytes())
              # This is a direct desktop port, not an App Store build. Namida
              # needs to index user-selected music folders and artwork files.
              data['com.apple.security.app-sandbox'] = False
              data['com.apple.security.files.user-selected.read-only'] = True
              p.write_bytes(plistlib.dumps(data))

          appinfo = Path('macos/Runner/Configs/AppInfo.xcconfig')
          text = appinfo.read_text()
          lines = []
          found_name = False
          for line in text.splitlines():
              if line.startswith('PRODUCT_NAME ='):
                  lines.append('PRODUCT_NAME = Namida')
                  found_name = True
              elif line.startswith('PRODUCT_BUNDLE_IDENTIFIER ='):
                  lines.append('PRODUCT_BUNDLE_IDENTIFIER = com.msob7y.namida.macosmusic')
              else:
                  lines.append(line)
          if not found_name:
              lines.append('PRODUCT_NAME = Namida')
          appinfo.write_text('\n'.join(lines) + '\n')
          PY

      - name: Resolve public dependencies
        run: flutter pub get

      - name: Verify private YouTube packages are gone
        run: |
          ! grep -q "github.com/namidaco/youtipie" pubspec.yaml
          ! grep -q "github.com/namidaco/namico_login_manager" pubspec.yaml
          ! grep -q "github.com/namidaco/namico_subscription_manager" pubspec.yaml

      - name: Build macOS release
        run: flutter build macos --release

      - name: Package app
        run: |
          cd build/macos/Build/Products/Release
          APP=$(find . -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          echo "Packaging real Namida port: $APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" Namida-macOS-Music-Port.zip

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: Namida-macOS-Music-Port
          path: build/macos/Build/Products/Release/Namida-macOS-Music-Port.zip
          if-no-files-found: error
